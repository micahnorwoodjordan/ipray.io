<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>new prayer request submitted</title>
    </head>
    <body style="margin:0;padding:0;background-color:#1c1c1e;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr>
                <td align="center" valign="top" style="padding:120px 20px 60px 20px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                        style="max-width:520px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e6e6e6;line-height:1.7;text-align:center;">
                        <tr>
                            <td style="font-size:16px;color:#a0a0a0;padding-bottom:28px;">a new prayer request has been submitted</td>
                        </tr>
                        <tr>
                            <td style="font-size:16px;padding-bottom:20px;">name: {{name}}</td>
                        </tr>
                        <tr>
                            <td style="font-size:15px;color:#ffffff;padding-bottom:50px;">"{{prayer_content}}"</td>
                        </tr>
                        <tr>
                            <td align="center" style="padding-bottom:60px;">
                                <table role="presentation" cellpadding="0" cellspacing="0">
                                    <tr>
                                        <td align="center" bgcolor="#2c2c2e" style="border-radius:6px;">
                                            <a href="https://ipray.io/admin" target="_blank"
                                                style="display:inline-block;padding:14px 28px;font-size:15px;font-weight:500;color:#ffffff;text-decoration:none;border-radius:6px;background-color:#2c2c2e;">
                                                review in admin
                                            </a>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                        <tr>
                            <td style="font-size:15px;font-weight:500;padding-bottom:18px;">“bear one another’s burdens, and so fulfill the law of Christ.”</td>
                        </tr>
                        <tr>
                            <td style="font-size:14px;color:#a0a0a0;padding-bottom:40px;">— Galatians 6:2</td>
                        </tr>
                        <tr>
                            <td style="font-size:12px;color:#6f6f6f;padding-top: 20px;">2026 ipray.io — all prayers are private.</td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
